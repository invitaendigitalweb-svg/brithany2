<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años</title>

    <!-- Etiquetas Open Graph para la miniatura de WhatsApp -->
    <meta property="og:title" content="Mis 15 Años">
    <meta property="og:description" content="Te invito a celebrar este momento tan especial conmigo. Haz click para abrir tu invitación.">
    <meta property="og:image" content="portada.jpg">
    <meta property="og:url" content="">
    <meta property="og:type" content="https://invitaendigitalweb-svg.github.io/xvbrithany">

    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/ss-abigail" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #e8e2d8;
            font-family: 'SS Abigail', serif;
        }

        /* Pantalla de bienvenida / Sobre inicial */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease, visibility 1s ease;
            cursor: pointer;
        }

        #welcome-screen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* Contenedor principal estilo tarjeta móvil centrada */
        .invitation-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: #f9f6f0;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-img {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .section-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animación de entrada con zoom elegante */
        .animate-zoom {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-zoom.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Animación especial flotante/deslizante para vestimenta y regalos */
        .animate-float {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-float.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animación padrisima especial (Flip 3D con destello) para la sección de Asistencia */
        .animate-flip-special {
            opacity: 0;
            transform: perspective(1000px) rotateX(25deg) scale(0.85);
            filter: brightness(1.2);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), filter 1.4s ease;
        }

        .animate-flip-special.active {
            opacity: 1;
            transform: perspective(1000px) rotateX(0deg) scale(1);
            filter: brightness(1);
        }

        /* Sección de la cuenta regresiva en fondo blanco */
        .countdown-section {
            width: 100%;
            padding: 40px 20px 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .countdown {
            display: flex;
            gap: 35px;
            align-items: flex-end;
            justify-content: center;
        }

        .block {
            text-align: center;
            position: relative;
        }

        .number {
            font-size: 50px;
            color: #BB9885;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(187, 152, 133, 0.25);
        }

        .block::after {
            content: "";
            display: block;
            width: 32px;
            height: 1px;
            background: rgba(187, 152, 133, 0.4);
            margin: 8px auto 6px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #A37E6B;
        }

        /* Sección de Ceremonia y Ubicación */
        .location-section {
            width: 100%;
            background-color: #F9EEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 45px 20px;
        }

        .location-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de Recepción */
        .reception-section {
            width: 100%;
            background-color: #F9EEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 45px 20px;
        }

        .reception-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de la imagen de título de galería */
        .gallery-title-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .gallery-title-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección del Carrusel con altura extendida */
        .gallery-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
            padding: 0;
            margin: 0;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 600px; 
            overflow: hidden;
            background: #f9f6f0;
        }

        .slider-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slider-container img.active {
            opacity: 1;
        }

        /* Botón personalizado de ubicación (Letras más gruesas añadidas aquí) */
        .location-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background-color: #E5A6AC;
            color: #ffffff;
            font-family: 'SS Abigail', serif;
            font-size: 13px;
            font-weight: 700; /* <--- Esto hace que las letras se vean más gruesas */
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(229, 166, 172, 0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .location-btn:hover {
            transform: scale(1.05);
            background-color: #d8959b;
        }

        /* Confirmación de asistencia integrada */
        .confirmation-section {
            width: 100%;
            background:
                radial-gradient(
                    circle at top,
                    #fff9fa 0%,
                    #fcecef 45%,
                    #f7dfe5 100%
                );
            font-family: 'Montserrat', sans-serif;
            color: #5d424a;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

.contenedor {

  width: 100%;

  max-width: 520px;

}


.tarjeta {

  background:
    rgba(255,255,255,.92);

  border:
    1px solid #d5ad65;

  border-radius:
    25px;

  padding:
    35px 28px;

  box-shadow:
    0 15px 45px
    rgba(128,72,89,.15);

}


.titulo {

  text-align: center;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 42px;

  color: #a77b2f;

  margin:
    0 0 8px;

}


.subtitulo {

  text-align: center;

  font-size: 13px;

  color: #80616a;

  margin-bottom: 30px;

}


.separador {

  width: 70px;

  height: 1px;

  background: #caa35b;

  margin:
    12px auto 28px;

}


.grupo {

  margin-bottom: 24px;

}


.etiqueta {

  display: block;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 22px;

  color: #9c6d28;

  margin-bottom: 9px;

}


input[type="text"] {

  width: 100%;

  padding:
    14px 15px;

  border-radius:
    12px;

  border:
    1px solid #e0bdc7;

  background:
    #fffafb;

  outline: none;

  font-family:
    'Montserrat',
    sans-serif;

  color:
    #5d424a;

  font-size:
    14px;

}


input[type="text"]:focus {

  border-color:
    #c9a154;

  box-shadow:
    0 0 0 3px
    rgba(201,161,84,.12);

}


input[type="text"].error {

  border-color:
    #c86d7b;

  box-shadow:
    0 0 0 3px
    rgba(200,109,123,.10);

}


.ayuda {

  font-size:
    11px;

  color:
    #947b82;

  margin-top:
    6px;

  line-height:
    1.4;

}


.error-texto {

  display: none;

  font-size:
    11px;

  color:
    #b45b68;

  margin-top:
    6px;

  line-height:
    1.4;

}


.error-texto.visible {

  display: block;

}


.opciones {

  display: flex;

  gap: 12px;

}


.opcion {

  flex: 1;

}


.opcion input {

  display: none;

}


.opcion label {

  display: block;

  text-align: center;

  padding:
    13px 8px;

  border:
    1px solid #e0bdc7;

  border-radius:
    12px;

  cursor: pointer;

  font-size:
    13px;

  background:
    #fffafb;

  transition:
    .2s;

}


.opcion input:checked + label {

  background:
    #f2d5dc;

  border-color:
    #bd8d3e;

  color:
    #815d20;

  font-weight:
    600;

}


.boton {

  width: 100%;

  border: 0;

  border-radius:
    30px;

  padding:
    16px;

  background:
    linear-gradient(
      135deg,
      #c49a4d,
      #e0bd70,
      #b98536
    );

  color:
    white;

  font-family:
    'Montserrat',
    sans-serif;

  font-size:
    14px;

  font-weight:
    600;

  cursor:
    pointer;

  box-shadow:
    0 8px 20px
    rgba(174,126,48,.25);

  transition:
    .2s;

}


.boton:hover {

  transform:
    translateY(-1px);

}


.boton:disabled {

  opacity:
    .6;

  cursor:
    wait;

}


.mensaje {

  display: none;

  text-align: center;

  margin-top:
    25px;

  padding:
    18px;

  border-radius:
    15px;

  background:
    #fff6f8;

  border:
    1px solid #e5c3ca;

  line-height:
    1.6;

  font-size:
    14px;

}


.mensaje.visible {

  display: block;

}


.pase-contenedor {

  display: none;

  margin-top:
    30px;

}


.pase-contenedor.visible {

  display: block;

}


.pase {

  background:
    linear-gradient(
      135deg,
      #fffafb,
      #fdf0f3
    );

  border:
    2px solid #c9a154;

  border-radius:
    22px;

  padding:
    30px 22px;

  text-align:
    center;

  position:
    relative;

  overflow:
    hidden;

}


.pase::before,
.pase::after {

  content: "";

  position:
    absolute;

  width:
    100px;

  height:
    100px;

  border:
    1px solid
    rgba(201,161,84,.25);

  border-radius:
    50%;

}


.pase::before {

  top:
    -60px;

  left:
    -50px;

}


.pase::after {

  bottom:
    -60px;

  right:
    -50px;

}


.pase-titulo {

  font-family:
    'Cormorant Garamond',
    serif;

  color:
    #a77b2f;

  font-size:
    35px;

  margin-bottom:
    5px;

}


.pase-linea {

  width:
    55px;

  height:
    1px;

  background:
    #c9a154;

  margin:
    12px auto 20px;

}


.pase-nombres {

  font-family:
    'Cormorant Garamond',
    serif;

  font-size:
    25px;

  line-height:
    1.25;

  color:
    #66434d;

  margin-bottom:
    18px;

}


.pase-cantidad {

  font-size:
    13px;

  text-transform:
    uppercase;

  letter-spacing:
    2px;

  color:
    #98723a;

  margin-bottom:
    15px;

}


.codigo {

  display:
    inline-block;

  font-family:
    'Montserrat',
    sans-serif;

  font-size:
    28px;

  font-weight:
    600;

  letter-spacing:
    7px;

  color:
    #9c6d28;

  padding:
    9px 16px;
}


.botones-pase {

  display:
    flex;

  gap:
    10px;

  margin-top:
    15px;

}


.boton-secundario {

  flex:
    1;

  padding:
    13px;

  border-radius:
    25px;

  border:
    1px solid #c9a154;

  background:
    #fff;

  color:
    #90682b;

  cursor:
    pointer;

  font-family:
    'Montserrat',
    sans-serif;

  font-size:
    12px;

}


@media(max-width:450px) {

  .tarjeta {

    padding:
      28px 20px;

  }


  .titulo {

    font-size:
      37px;

  }


  .pase-nombres {

    font-size:
      22px;

  }

}


        /* Control de Música */
        #music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background-color: #ffd1dc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 100;
            border: 2px solid #ffffff;
            transition: transform 0.3s ease;
        }

        #music-control:hover {
            transform: scale(1.1);
        }

        #music-control svg {
            width: 24px;
            height: 24px;
            fill: #555555;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            display: none;
        }

        @media(max-width: 480px) {
            .invitation-wrapper {
                max-width: 100%;
                box-shadow: none;
            }
            .countdown { gap: 20px; }
            .number { font-size: 42px; }
            .label { font-size: 10px; }
            .slider-container { height: 520px; }
        }
    </style>

</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="welcome-screen" title="Haz clic para abrir">
        <img src="foto.jpg" alt="Sobre de invitación">
    </div>

    <!-- Contenedor general en formato tarjeta estilo celular -->
    <div class="invitation-wrapper">
        <!-- Contenido Principal -->
        <div id="main-content">
            <!-- 1. Foto de Portada -->
            <section class="section-img">
                <img src="portada.jpg" alt="Portada de la invitación de Mis 15 Años">
            </section>

            <!-- 2. Foto de Frase -->
            <section class="section-img">
                <img src="frase.jpg" alt="Frase de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 3. Foto de Fecha -->
            <section class="section-img">
                <img src="fecha.jpg" alt="Fecha de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 4. Cuenta Regresiva -->
            <section class="countdown-section">
                <div class="countdown">
                    <div class="block">
                        <div id="days" class="number">0</div>
                        <div class="label">DÍAS</div>
                    </div>
                    <div class="block">
                        <div id="hours" class="number">00</div>
                        <div class="label">HORAS</div>
                    </div>
                    <div class="block">
                        <div id="minutes" class="number">00</div>
                        <div class="label">MINUTOS</div>
                    </div>
                    <div class="block">
                        <div id="seconds" class="number">00</div>
                        <div class="label">SEGUNDOS</div>
                    </div>
                </div>
            </section>

            <!-- 5. Foto de Ceremonia y Ubicación -->
            <section class="location-section">
                <img src="ceremonia.jpg" alt="Detalles de ceremonia" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Parroquia+del+Sagrado+Coraz%C3%B3n+de+Jes%C3%BAs/@28.6262123,-106.0734464,859m/data=!3m2!1e3!4b1!4m6!3m5!1s0x86ea5caebcfb39a9:0x7142c0ef10e82b9b!8m2!3d28.6262123!4d-106.0711241!16s%2Fg%2F1tgdcw5w!18m1!1e1?entry=ttu&g_ep=EgoyMDI2MDcyOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <!-- 6. Foto de Recepción y Ubicación -->
            <section class="reception-section">
                <img src="recepcion.jpg" alt="Detalles de recepción" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Quinta+kiri,+C.+Guadalupe+Posadas,+11+de+Febrero+Sur,+31066+Chihuahua,+Chih./data=!4m2!3m1!1s0x86ea5bac27293f75:0x64a47b49dd5ce364!18m1!1e1?utm_source=mstt_1&entry=gps&coh=192189&g_ep=CAESBzI2LjI5LjIYACCenQoqnwEsOTQyNjc3MjcsOTQyOTIxOTUsOTQyOTk1MzIsMTAwNzk2NDk4LDEwMDc5Nzc2MSwxMDA3OTY1MzUsOTQyODA1NzYsOTQyMDczOTQsOTQyMDc1MDYsOTQyMDg1MDYsOTQyMTg2NTMsOTQyMjk4MzksOTQyNzUxNjgsOTQyNzk2MTksMTAwODE1NjM1LDEwMDgyMDIzNywxMDA4MjI0ODlCAk1Y&skid=04858c28-c6d2-4605-bc97-a16742ce76be&g_st=aw" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <!-- 7. Foto Título de Galería -->
            <section class="gallery-title-section">
                <img src="galeria.jpg" alt="Galería de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 8. Carrusel de Fotos -->
            <section class="gallery-section">
                <div class="slider-container animate-zoom">
                    <img src="https://i.imgur.com/MSYBfYT.jpeg" class="active" alt="Foto 1">
                    <img src="https://i.imgur.com/OwS4Q50.png" alt="Foto 2">
                    <img src="https://i.imgur.com/L67IlOh.jpeg" alt="Foto 3">
                </div>
            </section>

            <!-- 9. Foto de Vestimenta -->
            <section class="section-img">
                <img src="vestimenta.jpg" alt="Código de vestimenta" class="animate-float">
            </section>

            <!-- 10. Foto de Regalo -->
            <section class="section-img">
                <img src="regalo.jpg" alt="Sugerencia de regalo" class="animate-float">
            </section>

            <!-- 11. Confirmación de asistencia integrada -->
            <section class="confirmation-section">
                <div class="contenedor">


                <div class="tarjeta">


                <h1 class="titulo">
                  Confirmación
                </h1>


                <div class="subtitulo">
                  Agradecemos confirmar su asistencia
                </div>


                <div class="separador"></div>


                <form id="formulario">


                <!-- =========================================
                     INVITADO 1
                ========================================= -->


                <div class="grupo">

                <label class="etiqueta">
                  Nombre 1 invitado
                </label>


                <input
                  type="text"
                  id="invitado1"
                  placeholder="Nombre y dos apellidos"
                  required
                  autocomplete="name"
                >


                <div class="ayuda">
                  Escribe nombre, apellido paterno y apellido materno.
                </div>


                <div
                  id="errorInvitado1"
                  class="error-texto">
                </div>


                </div>


                <!-- =========================================
                     ASISTENCIA 1
                ========================================= -->


                <div class="grupo">

                <label class="etiqueta">
                  Asistencia
                </label>


                <div class="opciones">


                <div class="opcion">

                <input
                  type="radio"
                  name="asistencia1"
                  id="si1"
                  value="SI"
                  required
                >


                <label for="si1">
                  Sí asistiré
                </label>

                </div>


                <div class="opcion">

                <input
                  type="radio"
                  name="asistencia1"
                  id="no1"
                  value="NO"
                >


                <label for="no1">
                  No asistiré
                </label>

                </div>


                </div>

                </div>


                <!-- =========================================
                     INVITADO 2
                ========================================= -->


                <div class="grupo">

                <label class="etiqueta">
                  Nombre 2 invitado
                </label>


                <input
                  type="text"
                  id="invitado2"
                  placeholder="Nombre y dos apellidos"
                  autocomplete="name"
                >


                <div class="ayuda">
                  Déjalo vacío si el pase es para una sola persona.
                </div>


                <div
                  id="errorInvitado2"
                  class="error-texto">
                </div>


                </div>


                <!-- =========================================
                     ASISTENCIA 2
                ========================================= -->


                <div class="grupo">

                <label class="etiqueta">
                  Asistencia
                </label>


                <div class="opciones">


                <div class="opcion">

                <input
                  type="radio"
                  name="asistencia2"
                  id="si2"
                  value="SI"
                >


                <label for="si2">
                  Sí asistiré
                </label>

                </div>


                <div class="opcion">

                <input
                  type="radio"
                  name="asistencia2"
                  id="no2"
                  value="NO"
                >


                <label for="no2">
                  No asistiré
                </label>

                </div>


                </div>

                </div>


                <button
                  class="boton"
                  id="botonEnviar"
                  type="submit"
                >
                  Enviar confirmación

const API_URL =
'https://script.google.com/macros/s/AKfycbylTcH2HuumxZuqGPFhWKhQwpmZrK8vqNxc4x87lxO2RsUh8BKSnLGEH2TPODx5_hdc/exec';


// ======================================================
// JSONP
// ======================================================

function llamarAPI(parametros) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'respuesta_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 10000
        );


      const script =
        document.createElement('script');


      const query =
        new URLSearchParams({

          ...parametros,

          callback:
            callbackName

        });


      const tiempoLimite =
        setTimeout(() => {

          limpiar();


          reject(
            new Error(
              'La solicitud tardó demasiado.'
            )
          );

        }, 15000);


      window[callbackName] =
        function(data) {

          clearTimeout(
            tiempoLimite
          );

          limpiar();

          resolve(data);

        };


      function limpiar() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(script);

        }

      }


      script.onerror =
        function() {

          clearTimeout(
            tiempoLimite
          );


          limpiar();


          reject(
            new Error(
              'No fue posible conectar con el servidor.'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();


      document.body
        .appendChild(script);

    }
  );

}


// ======================================================
// VALIDAR NOMBRE COMPLETO
// ======================================================
//
// Mínimo:
//
// Nombre + Apellido + Apellido
//
// Ejemplo:
//
// Alondra Castro Peña
//
// ======================================================

function validarNombreCompleto(nombre) {

  const partes =
    nombre
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  return partes.length >= 3;

}


// ======================================================
// MOSTRAR ERROR DE NOMBRE
// ======================================================

function mostrarErrorNombre(
  input,
  elemento,
  texto
) {

  input.classList.add('error');

  elemento.textContent =
    texto;

  elemento.classList.add(
    'visible'
  );

}


// ======================================================
// QUITAR ERROR
// ======================================================

function quitarErrorNombre(
  input,
  elemento
) {

  input.classList.remove(
    'error'
  );

  elemento.textContent =
    '';

  elemento.classList.remove(
    'visible'
  );

}


// ======================================================
// VALIDACIÓN DEL FORMULARIO
// ======================================================

function validarFormulario() {

  const invitado1 =
    document
      .getElementById(
        'invitado1'
      )
      .value
      .trim();


  const invitado2 =
    document
      .getElementById(
        'invitado2'
      )
      .value
      .trim();


  const error1 =
    document
      .getElementById(
        'errorInvitado1'
      );


  const error2 =
    document
      .getElementById(
        'errorInvitado2'
      );


  const input1 =
    document
      .getElementById(
        'invitado1'
      );


  const input2 =
    document
      .getElementById(
        'invitado2'
      );


  let valido = true;


  // ------------------------------------------
  // INVITADO 1
  // ------------------------------------------

  if (!validarNombreCompleto(
    invitado1
  )) {

    mostrarErrorNombre(
      input1,
      error1,
      'Es obligatorio escribir el nombre y los dos apellidos.'
    );

    valido = false;

  } else {

    quitarErrorNombre(
      input1,
      error1
    );

  }


  // ------------------------------------------
  // INVITADO 2
  // ------------------------------------------

  if (
    invitado2 &&
    !validarNombreCompleto(
      invitado2
    )
  ) {

    mostrarErrorNombre(
      input2,
      error2,
      'Si agregas un invitado, debes escribir su nombre y sus dos apellidos.'
    );

    valido = false;

  } else {

    quitarErrorNombre(
      input2,
      error2
    );

  }


  return valido;

}


// ======================================================
// FORMULARIO
// ======================================================

document
  .getElementById('formulario')
  .addEventListener(
    'submit',
    async function(e) {

      e.preventDefault();


      // ------------------------------------------
      // VALIDACIÓN
      // ------------------------------------------

      if (!validarFormulario()) {

        const primerError =
          document.querySelector(
            '.error'
          );


        if (primerError) {

          primerError.focus();

        }


        return;

      }


      const boton =
        document.getElementById(
          'botonEnviar'
        );


      boton.disabled = true;

      boton.textContent =
        'Enviando...';


      const invitado1 =
        document
          .getElementById(
            'invitado1'
          )
          .value
          .trim();


      const invitado2 =
        document
          .getElementById(
            'invitado2'
          )
          .value
          .trim();


      const asistencia1 =
        document
          .querySelector(
            'input[name="asistencia1"]:checked'
          )
          ?.value || '';


      const asistencia2Elemento =
        document
          .querySelector(
            'input[name="asistencia2"]:checked'
          );


      const asistencia2 =
        asistencia2Elemento
          ? asistencia2Elemento.value
          : '';


      // ------------------------------------------
      // VALIDAR ASISTENCIA 2
      // ------------------------------------------

      if (
        invitado2 &&
        !asistencia2
      ) {

        mostrarMensaje(
          'Selecciona la asistencia del invitado 2.',
          false
        );


        boton.disabled = false;

        boton.textContent =
          'Enviar confirmación';


        return;

      }


      try {

        const respuesta =
          await llamarAPI({

            accion:
              'confirmar',

            invitado1:
              invitado1,

            asistencia1:
              asistencia1,

            invitado2:
              invitado2,

            asistencia2:
              asistencia2

          });


        // --------------------------------------
        // ERROR
        // --------------------------------------

        if (!respuesta.ok) {

          mostrarMensaje(
            respuesta.mensaje,
            false
          );


          return;

        }


        // --------------------------------------
        // NADIE ASISTE
        // --------------------------------------

        if (
          respuesta.pases === 0
        ) {

          mostrarMensaje(
            respuesta.mensaje,
            true
          );


          document
            .getElementById(
              'paseContenedor'
            )
            .classList
            .remove(
              'visible'
            );


          return;

        }


        // --------------------------------------
        // MOSTRAR MENSAJE
        // --------------------------------------

        mostrarMensaje(
          respuesta.mensaje,
          true
        );


        // --------------------------------------
        // CREAR NOMBRES DEL PASE
        // --------------------------------------

        let nombres = '';


        if (
          respuesta.asistencia1 ===
          'SI'
        ) {

          nombres +=
            escaparHTML(
              respuesta.invitado1
            );

        }


        if (
          respuesta.invitado2 &&
          respuesta.asistencia2 ===
          'SI'
        ) {

          if (nombres) {

            nombres +=
              '<br>';

          }


          nombres +=
            escaparHTML(
              respuesta.invitado2
            );

        }


        document
          .getElementById(
            'paseNombres'
          )
          .innerHTML =
          nombres;


        // --------------------------------------
        // CANTIDAD DE PASES
        // --------------------------------------

        document
          .getElementById(
            'paseCantidad'
          )
          .textContent =
          respuesta.pases +
          (
            respuesta.pases === 1
              ? ' pase'
              : ' pases'
          );


        // --------------------------------------
        // CÓDIGO
        // --------------------------------------

        document
          .getElementById(
            'paseCodigo'
          )
          .textContent =
          respuesta.codigo;


        // --------------------------------------
        // MOSTRAR PASE
        // --------------------------------------

        document
          .getElementById(
            'paseContenedor'
          )
          .classList
          .add(
            'visible'
          );


        document
          .getElementById(
            'paseContenedor'
          )
          .scrollIntoView({

            behavior:
              'smooth',

            block:
              'center'

          });


      }

      catch(error) {

        mostrarMensaje(
          'No pudimos enviar la confirmación. Intenta nuevamente.',
          false
        );

      }

      finally {

        boton.disabled =
          false;

        boton.textContent =
          'Enviar confirmación';

      }

    }
  );


// ======================================================
// MENSAJE
// ======================================================

function mostrarMensaje(
  texto,
  correcto
) {

  const mensaje =
    document.getElementById(
      'mensaje'
    );


  mensaje.innerHTML =
    escaparHTML(
      texto
    );


  mensaje.classList.add(
    'visible'
  );

}


// ======================================================
// ESCAPAR HTML
// ======================================================

function escaparHTML(
  texto
) {

  return String(texto)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


// ======================================================
// DESCARGAR PASE
// ======================================================

async function descargarPase() {

  const pase =
    document.getElementById(
      'pase'
    );


  const canvas =
    await html2canvas(
      pase,
      {

        scale: 3,

        backgroundColor:
          '#fffafb',

        useCORS:
          true

      }
    );


  const enlace =
    document.createElement(
      'a'
    );


  const codigo =
    document
      .getElementById(
        'paseCodigo'
      )
      .textContent;


  enlace.download =
    'Pase-' +
    codigo +
    '.png';


  enlace.href =
    canvas.toDataURL(
      'image/png'
    );


  enlace.click();

}

// CAMBIAR ASISTENCIA
// ======================================================

function volverEditar() {

  document
    .getElementById(
      'paseContenedor'
    )
    .classList
    .remove(
      'visible'
    );


  document
    .getElementById(
      'mensaje'
    )
    .classList
    .remove(
      'visible'
    );


  window.scrollTo({

    top: 0,

    behavior:
      'smooth'

  });

}
