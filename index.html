<script>

const welcomeScreen =
document.getElementById('welcome-screen');

const mainContent =
document.getElementById('main-content');

const bgMusic =
document.getElementById('bg-music');

const musicControl =
document.getElementById('music-control');

const iconSpeaker =
document.getElementById('icon-speaker');

const iconPause =
document.getElementById('icon-pause');

let isPlaying = false;


welcomeScreen.addEventListener('click', () => {

welcomeScreen.style.opacity = '0';

setTimeout(() => {
    welcomeScreen.style.display = 'none';
}, 1000);

mainContent.style.visibility = 'visible';
mainContent.style.opacity = '1';

musicControl.classList.remove('hidden');

bgMusic.play().then(() => {

isPlaying = true;
updateMusicIcon();

}).catch(error => {

console.log(
"Reproducción automática bloqueada por el navegador:",
error
);

});

});


musicControl.addEventListener('click', () => {

if (isPlaying) {

bgMusic.pause();
isPlaying = false;

} else {

bgMusic.play();
isPlaying = true;

}

updateMusicIcon();

});


function updateMusicIcon() {

if (isPlaying) {

iconSpeaker.style.display = 'none';
iconPause.style.display = 'block';

} else {

iconSpeaker.style.display = 'block';
iconPause.style.display = 'none';

}

}


/* Animaciones */

const observerOptions = {
threshold: 0.1
};

const observer =
new IntersectionObserver(
(entries) => {

entries.forEach(entry => {

if (entry.isIntersecting) {
entry.target.classList.add('active');
}

});

},
observerOptions
);


document
.querySelectorAll(
'.animate-zoom, .animate-float, .animate-flip-special'
)
.forEach(el => {

observer.observe(el);

});


/* Carrusel */

const sliderImages =
document.querySelectorAll(
'.slider-container img'
);

let currentSlide = 0;

setInterval(() => {

sliderImages[currentSlide]
.classList.remove('active');

currentSlide =
(currentSlide + 1) %
sliderImages.length;

sliderImages[currentSlide]
.classList.add('active');

}, 3000);


/* Cuenta regresiva */

const DATE_TARGET =
new Date(2026, 7, 22, 15, 0, 0);

const days =
document.getElementById('days');

const hours =
document.getElementById('hours');

const minutes =
document.getElementById('minutes');

const seconds =
document.getElementById('seconds');

const MS = 1000;
const MIN = MS * 60;
const H = MIN * 60;
const D = H * 24;


function format(n) {
return n < 10 ? '0' + n : n;
}


(function updateCountdown() {

const now = new Date();

let dur =
DATE_TARGET - now;

if (dur < 0) dur = 0;

days.textContent =
Math.floor(dur / D);

hours.textContent =
format(Math.floor((dur % D) / H));

minutes.textContent =
format(Math.floor((dur % H) / MIN));

seconds.textContent =
format(Math.floor((dur % MIN) / MS));

setTimeout(updateCountdown, 1000);

})();


/* =====================================================

   ===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbyhKAlP-qujK1wFTBLsXt5x4jvJ3IEp39z7tKjiKAmcYCUZVgSn0kCVj-H4uohPJ4hx/exec'


function llamarAPI(parametros) {

return new Promise((resolve, reject) => {

const callback =
'cb_' +
Date.now() +
'_' +
Math.floor(Math.random() * 9999);

const script =
document.createElement('script');

const query =
new URLSearchParams({

...parametros,

callback: callback

});

const tiempo =
setTimeout(() => {

limpiar();
reject();

}, 15000);


window[callback] =
function(data) {

clearTimeout(tiempo);

limpiar();

resolve(data);

};


function limpiar() {

delete window[callback];

if (script.parentNode) {

script.parentNode.removeChild(script);

}

}


script.onerror = function() {

clearTimeout(tiempo);

limpiar();

reject();

};


script.src =
API_URL +
'?' +
query.toString();

document.body.appendChild(script);

});

}


/* =====================================================
   ENVIAR CONFIRMACIÓN
   ===================================================== */

async function enviar() {

const nombre1 =
document
.getElementById('nombre1')
.value
.trim();

const nombre2 =
document
.getElementById('nombre2')
.value
.trim();

const a1 =
document.querySelector(
'input[name="a1"]:checked'
)?.value || '';

const a2 =
document.querySelector(
'input[name="a2"]:checked'
)?.value || '';

const mensaje =
document.getElementById('mensaje');

const pases =
document.getElementById('pases');

const boton =
document.getElementById('boton');


if (!nombre1) {

mensaje.className =
'mensaje visible';

mensaje.textContent =
'Escribe el nombre del invitado 1.';

return;

}


if (
nombre1.split(/\s+/).length < 3
) {

mensaje.className =
'mensaje visible';

mensaje.textContent =
'Escribe el nombre completo del invitado 1.';

return;

}


if (!a1) {

mensaje.className =
'mensaje visible';

mensaje.textContent =
'Selecciona la asistencia del invitado 1.';

return;

}


if (
nombre2 &&
nombre2.split(/\s+/).length < 3
) {

mensaje.className =
'mensaje visible';

mensaje.textContent =
'Escribe el nombre completo del invitado 2.';

return;

}


if (
nombre2 &&
!a2
) {

mensaje.className =
'mensaje visible';

mensaje.textContent =
'Selecciona la asistencia del invitado 2.';

return;

}


boton.disabled = true;

boton.textContent = 'Enviando...';


try {

const respuesta =
await llamarAPI({

accion: 'confirmar',

invitado1: nombre1,

asistencia1: a1,

invitado2: nombre2,

asistencia2: a2

});


if (!respuesta.ok) {

mensaje.className =
'mensaje visible';

mensaje.textContent =
respuesta.mensaje;

return;

}


mensaje.className =
'mensaje visible';

mensaje.textContent =
respuesta.mensaje;


if (
respuesta.listaPases &&
respuesta.listaPases.length
) {

pases.className =
'pases visible';

pases.innerHTML = '';


respuesta.listaPases.forEach(
function(p, index) {

const idPase =
'pase_' +
index +
'_' +
Date.now();


pases.innerHTML += `

<div class="pase">

<div
class="contenido-pase"
id="${idPase}"
>

<div class="pase-titulo">
Pase de entrada
</div>

<div class="pase-linea"></div>

<div class="pase-nombre">
${escapar(p.nombre)}
</div>

<div class="codigo">
${escapar(p.codigo)}
</div>

<div class="codigo-texto">
Código de acceso
</div>

</div>

<button
type="button"
class="boton-descargar"
onclick="descargarPase('${idPase}',this)"
>
Descargar pase
</button>

</div>

`;

});

}

}


catch (error) {

console.error(error);

mensaje.className =
'mensaje visible';

mensaje.textContent =
'No se pudo conectar con el sistema.';

}


finally {

boton.disabled = false;

boton.textContent =
'Enviar confirmación';

}

}


/* =====================================================
   DESCARGAR PASE
   ===================================================== */

async function descargarPase(idPase, boton) {

const contenido =
document.getElementById(idPase);

if (!contenido) {
return;
}

boton.disabled = true;

boton.textContent =
'Preparando pase...';


try {

if (!window.html2canvas) {

await new Promise(
(resolve, reject) => {

const script =
document.createElement('script');

script.src =
'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

script.onload = resolve;

script.onerror = reject;

document.head.appendChild(script);

}
);

}


const canvas =
await html2canvas(
contenido,
{

scale: 3,

backgroundColor:
'#fffafb',

useCORS: true,

logging: false,

imageTimeout: 15000,

allowTaint: false

}
);


const nombre =
contenido
.querySelector('.pase-nombre')
.textContent
.trim();


const nombreArchivo =
nombre

.replace(
/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,
''
)

.replace(
/\s+/g,
'-'
)

.substring(
0,
50
)

||

'Invitado';


canvas.toBlob(
function(blob) {

if (!blob) {

throw new Error(
'No se pudo generar la imagen.'
);

}


const url =
URL.createObjectURL(blob);

const enlace =
document.createElement('a');

enlace.href = url;

enlace.download =
'Pase-' +
nombreArchivo +
'.png';

document.body.appendChild(enlace);

enlace.click();

document.body.removeChild(enlace);


setTimeout(
function() {

URL.revokeObjectURL(url);

},
1000
);

},
'image/png'
);


}


catch (error) {

console.error(error);

alert(
'No se pudo descargar el pase. Intenta nuevamente.'
);

}


finally {

boton.disabled = false;

boton.textContent =
'Descargar pase';

}

}


/* =====================================================
   ESCAPAR TEXTO
   ===================================================== */

function escapar(texto) {

return String(texto)

.replace(
/&/g,
'&amp;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/'/g,
'&#039;'
);

}

</script>
