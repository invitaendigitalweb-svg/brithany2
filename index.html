<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#e8e2d8;
    font-family:'SS Abigail',serif;
}


/* =====================================================
   PORTADA / SOBRE
===================================================== */

#welcome-screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#f9f6f0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 1s ease, visibility 1s ease;
    cursor:pointer;
}

#welcome-screen img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
}


/* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

.invitation-wrapper{
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:#f9f6f0;
    box-shadow:0 0 25px rgba(0,0,0,.15);
    min-height:100vh;
}

#main-content{
    opacity:0;
    visibility:hidden;
    transition:opacity 1.5s ease;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =====================================================
   IMÁGENES
===================================================== */

.section-img{
    width:100%;
    background:#f9f6f0;
    display:flex;
    justify-content:center;
    align-items:center;
    line-height:0;
    font-size:0;
}

.section-img img{
    width:100%;
    height:auto;
    display:block;
}


/* =====================================================
   ANIMACIONES
===================================================== */

.animate-zoom{
    opacity:0;
    transform:scale(.95);
    transition:
        opacity 1.2s ease-out,
        transform 1.2s ease-out;
}

.animate-zoom.active{
    opacity:1;
    transform:scale(1);
}

.animate-float{
    opacity:0;
    transform:translateY(40px);
    transition:
        opacity 1.2s ease-out,
        transform 1.2s ease-out;
}

.animate-float.active{
    opacity:1;
    transform:translateY(0);
}


/* =====================================================
   CONTADOR
===================================================== */

.countdown-section{
    width:100%;
    padding:40px 20px 30px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
}

.countdown{
    display:flex;
    gap:35px;
    align-items:flex-end;
    justify-content:center;
}

.block{
    text-align:center;
    position:relative;
}

.number{
    font-size:50px;
    color:#BB9885;
    line-height:1;
    letter-spacing:2px;
    text-shadow:0 2px 8px rgba(187,152,133,.25);
}

.block::after{
    content:"";
    display:block;
    width:32px;
    height:1px;
    background:rgba(187,152,133,.4);
    margin:8px auto 6px;
}

.label{
    font-size:11px;
    letter-spacing:3px;
    color:#A37E6B;
}


/* =====================================================
   UBICACIONES
===================================================== */

.location-section,
.reception-section{
    width:100%;
    background:#F9EEEB;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 20px 45px;
}

.location-section img,
.reception-section img{
    width:100%;
    height:auto;
    display:block;
}

.location-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 28px;
    background:#E5A6AC;
    color:#fff;
    font-family:'SS Abigail',serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-decoration:none;
    border-radius:30px;
    box-shadow:0 4px 10px rgba(229,166,172,.3);
    transition:
        transform .3s ease,
        background-color .3s ease;
}

.location-btn:hover{
    transform:scale(1.05);
    background:#d8959b;
}


/* =====================================================
   GALERÍA
===================================================== */

.gallery-title-section{
    width:100%;
    background:#f9f6f0;
    display:flex;
    justify-content:center;
    align-items:center;
    line-height:0;
    font-size:0;
}

.gallery-title-section img{
    width:100%;
    height:auto;
    display:block;
}

.gallery-section{
    width:100%;
    background:#f9f6f0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0;
    margin:0;
}

.slider-container{
    position:relative;
    width:100%;
    height:600px;
    overflow:hidden;
    background:#f9f6f0;
}

.slider-container img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.2s ease-in-out;
}

.slider-container img.active{
    opacity:1;
}


/* =====================================================
   CONFIRMACIÓN / PASES
===================================================== */

#consulta-pases{
    width:100%;
    padding:35px 18px 50px;

    background:
        linear-gradient(
            135deg,
            #fff9fa 0%,
            #fcecef 45%,
            #f7dfe5 100%
        );

    color:#5d424a;
}

.consulta-card{
    width:100%;

    background:rgba(255,255,255,.94);

    border:1px solid #d5ad65;

    border-radius:25px;

    padding:35px 25px;

    box-shadow:
        0 15px 45px
        rgba(128,72,89,.15);
}

.consulta-titulo{
    text-align:center;

    font-family:'Cormorant Garamond',serif;

    font-size:42px;

    color:#a77b2f;

    margin:0 0 8px;

    line-height:1.1;
}

.consulta-subtitulo{
    text-align:center;

    font-family:'Montserrat',sans-serif;

    font-size:13px;

    line-height:1.6;

    color:#80616a;

    margin-bottom:12px;
}

.separador{
    width:70px;
    height:1px;

    background:#caa35b;

    margin:12px auto 28px;
}


/* =====================================================
   GRUPOS
===================================================== */

.grupo{
    margin-bottom:24px;
}

.etiqueta{
    display:block;

    font-family:'Cormorant Garamond',serif;

    font-size:22px;

    color:#9c6d28;

    margin-bottom:9px;
}

#consulta-pases input[type="text"]{
    width:100%;

    padding:14px 15px;

    border-radius:12px;

    border:1px solid #e0bdc7;

    background:#fffafb;

    outline:none;

    font-family:'Montserrat',sans-serif;

    color:#5d424a;

    font-size:14px;
}

#consulta-pases input[type="text"]:focus{
    border-color:#c9a154;

    box-shadow:
        0 0 0 3px
        rgba(201,161,84,.12);
}


/* =====================================================
   OPCIONES ASISTENCIA
===================================================== */

.opciones{
    display:flex;
    gap:12px;
}

.opcion{
    flex:1;
}

.opcion input{
    display:none;
}

.opcion label{
    display:block;

    text-align:center;

    padding:13px 8px;

    border:1px solid #e0bdc7;

    border-radius:12px;

    cursor:pointer;

    font-family:'Montserrat',sans-serif;

    font-size:13px;

    background:#fffafb;

    transition:.2s;
}

.opcion label:hover{
    border-color:#bd8d3e;
}

.opcion input:checked + label{
    background:#f2d5dc;

    border-color:#bd8d3e;

    color:#815d20;

    font-weight:600;
}


/* =====================================================
   BOTÓN ENVIAR
===================================================== */

.boton{
    width:100%;

    border:0;

    border-radius:30px;

    padding:16px;

    background:
        linear-gradient(
            135deg,
            #c49a4d,
            #e0bd70,
            #b98536
        );

    color:white;

    font-family:'Montserrat',sans-serif;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 8px 20px
        rgba(174,126,48,.25);

    transition:.2s;
}

.boton:hover{
    transform:translateY(-1px);
}

.boton:disabled{
    opacity:.6;
    cursor:wait;
}


/* =====================================================
   MENSAJE
===================================================== */

.mensaje{
    display:none;

    text-align:center;

    margin-top:25px;

    padding:18px;

    border-radius:15px;

    background:#fff6f8;

    border:1px solid #e5c3ca;

    line-height:1.6;

    font-family:'Montserrat',sans-serif;

    font-size:14px;
}

.mensaje.visible{
    display:block;
}


/* =====================================================
   PASE
===================================================== */

.pase-contenedor{
    display:none;

    margin-top:30px;
}

.pase-contenedor.visible{
    display:block;
}

.pase{
    background:
        linear-gradient(
            135deg,
            #fffafb,
            #fdf0f3
        );

    border:2px solid #c9a154;

    border-radius:22px;

    padding:30px 22px;

    text-align:center;

    position:relative;

    overflow:hidden;
}

.pase::before,
.pase::after{
    content:"";

    position:absolute;

    width:100px;
    height:100px;

    border:1px solid rgba(201,161,84,.25);

    border-radius:50%;
}

.pase::before{
    top:-60px;
    left:-50px;
}

.pase::after{
    bottom:-60px;
    right:-50px;
}

.pase-titulo{
    font-family:'Cormorant Garamond',serif;

    color:#a77b2f;

    font-size:35px;

    margin-bottom:5px;
}

.pase-linea{
    width:55px;
    height:1px;

    background:#c9a154;

    margin:12px auto 20px;
}

.pase-nombres{
    font-family:'Cormorant Garamond',serif;

    font-size:25px;

    line-height:1.25;

    color:#66434d;

    margin-bottom:18px;
}

.pase-cantidad{
    font-family:'Montserrat',sans-serif;

    font-size:13px;

    text-transform:uppercase;

    letter-spacing:2px;

    color:#98723a;

    margin-bottom:15px;
}

.codigo{
    display:inline-block;

    font-family:'Montserrat',sans-serif;

    font-size:28px;

    font-weight:600;

    letter-spacing:7px;

    color:#9c6d28;

    padding:9px 16px;

    border-top:1px solid #d4b477;

    border-bottom:1px solid #d4b477;
}


/* =====================================================
   BOTONES DEL PASE
===================================================== */

.botones-pase{
    display:flex;

    gap:10px;

    margin-top:15px;
}

.boton-secundario{
    flex:1;

    padding:13px;

    border-radius:25px;

    border:1px solid #c9a154;

    background:#fff;

    color:#90682b;

    cursor:pointer;

    font-family:'Montserrat',sans-serif;

    font-size:12px;

    transition:.2s;
}

.boton-secundario:hover{
    background:#fff7f8;
    transform:translateY(-1px);
}


/* =====================================================
   OCULTO
===================================================== */

.oculto{
    display:none !important;
}


/* =====================================================
   MÚSICA
===================================================== */

#music-control{
    position:fixed;

    bottom:20px;
    right:20px;

    width:45px;
    height:45px;

    background:#E5A6AC;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,.2);

    cursor:pointer;

    z-index:999;

    transition:transform .3s ease;
}

#music-control:hover{
    transform:scale(1.1);
}

#music-control svg{
    width:22px;
    height:22px;
    fill:#fff;
}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:480px){

    .invitation-wrapper{
        max-width:100%;
        box-shadow:none;
    }

    .countdown{
        gap:20px;
    }

    .number{
        font-size:42px;
    }

    .label{
        font-size:10px;
    }

    .slider-container{
        height:520px;
    }

    .consulta-card{
        padding:28px 20px;
    }

    .consulta-titulo{
        font-size:37px;
    }

    .pase-nombres{
        font-size:22px;
    }

    .botones-pase{
        flex-direction:column;
    }

}

</style>

</head>

<script>


/* =====================================================
   PORTADA Y MÚSICA
===================================================== */

const welcomeScreen =
document.getElementById(
    'welcome-screen'
);

const mainContent =
document.getElementById(
    'main-content'
);

const bgMusic =
document.getElementById(
    'bg-music'
);

const musicControl =
document.getElementById(
    'music-control'
);

const iconSpeaker =
document.getElementById(
    'icon-speaker'
);

const iconPause =
document.getElementById(
    'icon-pause'
);


let isPlaying = false;


welcomeScreen.addEventListener(
    'click',
    () => {

        welcomeScreen.style.opacity =
            '0';

        setTimeout(
            () => {

                welcomeScreen.style.display =
                    'none';

            },
            1000
        );


        mainContent.style.visibility =
            'visible';

        mainContent.style.opacity =
            '1';


        musicControl.classList.remove(
            'oculto'
        );


        bgMusic.play()
        .then(
            () => {

                isPlaying = true;

                updateMusicIcon();

            }
        )
        .catch(
            error => {

                console.log(
                    "Reproducción automática bloqueada:",
                    error
                );

            }
        );

    }
);


musicControl.addEventListener(
    'click',
    () => {

        if(isPlaying){

            bgMusic.pause();

            isPlaying = false;

        }
        else{

            bgMusic.play();

            isPlaying = true;

        }

        updateMusicIcon();

    }
);


function updateMusicIcon(){

    if(isPlaying){

        iconSpeaker.style.display =
            'none';

        iconPause.style.display =
            'block';

    }
    else{

        iconSpeaker.style.display =
            'block';

        iconPause.style.display =
            'none';

    }

}

const observerOptions = {
    threshold:.1
};


const observer =
new IntersectionObserver(
    (entries) => {

        entries.forEach(
            entry => {

                if(
                    entry.isIntersecting
                ){

                    entry.target.classList
                        .add('active');

                }

            }
        );

    },
    observerOptions
);


document
.querySelectorAll(
    '.animate-zoom, .animate-float'
)
.forEach(
    el => {

        observer.observe(el);

    }
);

/* =====================================================

===================================================== */

const DATE_TARGET =
new Date(
    2026,
    7,
    22,
    15,
    0,
    0
);


const days =
document.getElementById(
    'days'
);

const hours =
document.getElementById(
    'hours'
);

const minutes =
document.getElementById(
    'minutes'
);

const seconds =
document.getElementById(
    'seconds'
);


const MS = 1000;
const MIN = MS * 60;
const H = MIN * 60;
const D = H * 24;


function format(n){

    return n < 10
        ? '0' + n
        : n;

}


(function updateCountdown(){

    const now =
        new Date();

    let dur =
        DATE_TARGET - now;


    if(dur < 0){

        dur = 0;

    }


    days.textContent =
        Math.floor(
            dur / D
        );


    hours.textContent =
        format(
            Math.floor(
                (dur % D) / H
            )
        );


    minutes.textContent =
        format(
            Math.floor(
                (dur % H) / MIN
            )
        );


    seconds.textContent =
        format(
            Math.floor(
                (dur % MIN) / MS
            )
        );


    setTimeout(
        updateCountdown,
        1000
    );

})();


/* =====================================================
   API DE GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbynMO0TS-5heOseGgJ65PaPA1V7qUO2IVTHc5K2TDxvs7S6yTspN693CSlGKrTBiz1i/exec';


/* =====================================================
   JSONP
===================================================== */

function llamarAPI(parametros) {

    return new Promise(
        (resolve, reject) => {

            const callbackName =
                'respuesta_' +
                Date.now() +
                '_' +
                Math.floor(
                    Math.random() * 10000
                );


            const script =
                document.createElement(
                    'script'
                );


            const query =
                new URLSearchParams({
                    ...parametros,
                    callback: callbackName
                });


            const tiempoLimite =
                setTimeout(
                    () => {

                        limpiar();

                        reject(
                            new Error(
                                'La solicitud tardó demasiado.'
                            )
                        );

                    },
                    15000
                );


            window[callbackName] =
                function(data) {

                    clearTimeout(
                        tiempoLimite
                    );

                    limpiar();

                    resolve(data);

                };


            function limpiar() {

                delete window[
                    callbackName
                ];


                if(script.parentNode){

                    script
                    .parentNode
                    .removeChild(
                        script
                    );

                }

            }


            script.onerror =
                function() {

                    clearTimeout(
                        tiempoLimite
                    );

                    limpiar();

                    reject(
                        new Error(
                            'No fue posible conectar con el servidor.'
                        )
                    );

                };


            script.src =
                API_URL +
                '?' +
                query.toString();


            document.body.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   FORMULARIO
===================================================== */

document
.getElementById('formulario')
.addEventListener(
    'submit',
    async function(e) {

        e.preventDefault();


        const boton =
            document.getElementById(
                'botonEnviar'
            );


        boton.disabled = true;

        boton.textContent =
            'Enviando...';


        const invitado1 =
            document
            .getElementById('invitado1')
            .value
            .trim();


        const invitado2 =
            document
            .getElementById('invitado2')
            .value
            .trim();


        const asistencia1 =
            document
            .querySelector(
                'input[name="asistencia1"]:checked'
            )?.value || '';


        const asistencia2Elemento =
            document
            .querySelector(
                'input[name="asistencia2"]:checked'
            );


        const asistencia2 =
            asistencia2Elemento
            ? asistencia2Elemento.value
            : '';


        /*
         * Si hay nombre 2,
         * debe indicar asistencia.
         */

        if(
            invitado2 &&
            !asistencia2
        ){

            mostrarMensaje(
                'Selecciona la asistencia del invitado 2.',
                false
            );


            boton.disabled = false;

            boton.textContent =
                'Enviar confirmación';

            return;

        }


        try{

            const respuesta =
                await llamarAPI({

                    accion:
                        'confirmar',

                    invitado1:
                        invitado1,

                    asistencia1:
                        asistencia1,

                    invitado2:
                        invitado2,

                    asistencia2:
                        asistencia2

                });


            if(
                !respuesta.ok
            ){

                mostrarMensaje(
                    respuesta.mensaje,
                    false
                );

                return;

            }


            /*
             * NADIE ASISTE
             */

            if(
                Number(
                    respuesta.pases
                ) === 0
            ){

                mostrarMensaje(
                    respuesta.mensaje,
                    true
                );


                document
                .getElementById(
                    'paseContenedor'
                )
                .classList
                .remove(
                    'visible'
                );


                return;

            }


            /*
             * MOSTRAR PASE
             */

            mostrarMensaje(
                respuesta.mensaje,
                true
            );


            let nombres = '';


            if(
                respuesta.asistencia1 ===
                'SI'
            ){

                nombres +=
                    escaparHTML(
                        respuesta.invitado1
                    );

            }


            if(
                respuesta.invitado2 &&
                respuesta.asistencia2 ===
                'SI'
            ){

                if(nombres){

                    nombres +=
                        '<br>';

                }


                nombres +=
                    escaparHTML(
                        respuesta.invitado2
                    );

            }


            document
            .getElementById(
                'paseNombres'
            )
            .innerHTML =
                nombres;


            document
            .getElementById(
                'paseCantidad'
            )
            .textContent =
                respuesta.pases +
                (
                    respuesta.pases === 1
                    ? ' pase'
                    : ' pases'
                );


            document
            .getElementById(
                'paseCodigo'
            )
            .textContent =
                respuesta.codigo;


            document
            .getElementById(
                'paseContenedor'
            )
            .classList
            .add(
                'visible'
            );


            document
            .getElementById(
                'paseContenedor'
            )
            .scrollIntoView({
                behavior:'smooth',
                block:'center'
            });

        }

        catch(error){

            mostrarMensaje(
                'No pudimos enviar la confirmación. Intenta nuevamente.',
                false
            );

        }

        finally{

            boton.disabled = false;

            boton.textContent =
                'Enviar confirmación';

        }

    }
);


/* =====================================================
   MENSAJE
===================================================== */

function mostrarMensaje(
    texto,
    correcto
){

    const mensaje =
        document.getElementById(
            'mensaje'
        );


    mensaje.innerHTML =
        escaparHTML(
            texto
        );


    mensaje.classList.add(
        'visible'
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
){

    return String(texto || '')

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


/* =====================================================
   DESCARGAR PASE
===================================================== */

async function descargarPase(){

    const pase =
        document.getElementById(
            'pase'
        );


    if(!pase){

        return;

    }


    const canvas =
        await html2canvas(
            pase,
            {
                scale:3,

                backgroundColor:
                    '#fffafb',

                useCORS:true
            }
        );


    const enlace =
        document.createElement(
            'a'
        );


    const codigo =
        document
        .getElementById(
            'paseCodigo'
        )
        .textContent;


    enlace.download =
        'Pase-' +
        codigo +
        '.png';


    enlace.href =
        canvas.toDataURL(
            'image/png'
        );


    enlace.click();

}
